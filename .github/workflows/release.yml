name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with tmate debugging enabled'
        required: false
        default: false
        type: boolean
      publish_crate:
        description: 'Also publish to crates.io'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crate:
    name: Publish to crates.io
    if: github.event_name == 'push' || inputs.publish_crate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: false  # Don't save cache on release builds to avoid Cargo.lock issues
    
    - name: Setup tmate session
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      uses: mxschmitt/action-tmate@v3
    
    - name: Verify version
      run: |
        # Use cargo metadata for more robust version extraction
        cargo_version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
        
        # Skip version check for workflow_dispatch
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "✅ Manual run - using version from Cargo.toml: $cargo_version"
        else
          tag_version="${GITHUB_REF#refs/tags/v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "Error: Cargo.toml version ($cargo_version) doesn't match tag version ($tag_version)"
            exit 1
          fi
          echo "✅ Version verified: $cargo_version"
        fi
        
    - name: Run tests
      run: cargo test --all-features --verbose

    - name: Check code formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Verify package
      run: cargo package --verbose --locked

    - name: Publish to Crates.io
      run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
      env:
        CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
    - uses: actions/checkout@v4

    - name: Install Linux build dependencies
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

    - name: Link OpenSSL statically (Unix)
      if: matrix.target == 'x86_64-unknown-linux-gnu' || runner.os == 'macOS'
      run: echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

    - name: Set OpenSSL environment (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

    - uses: dtolnay/rust-toolchain@stable
      if: matrix.target != 'x86_64-unknown-linux-musl'
      with:
        targets: ${{ matrix.target }}

    - name: Build binary
      if: matrix.target != 'x86_64-unknown-linux-musl'
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Build musl binary in Alpine
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: |
        docker run --rm --platform linux/amd64 \
          -v "$GITHUB_WORKSPACE:/work" -w /work rust:alpine \
          sh -euc 'apk add --no-cache build-base openssl-dev openssl-libs-static pkgconf zlib-dev zlib-static && rustup target add x86_64-unknown-linux-musl && OPENSSL_STATIC=1 PKG_CONFIG_ALL_STATIC=1 cargo build --release --locked --target x86_64-unknown-linux-musl'

    - name: Verify musl binary has no shared library dependencies
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: |
        if readelf -l target/x86_64-unknown-linux-musl/release/sftui | grep -q INTERP; then
          echo "The musl binary requires shared libraries" >&2
          exit 1
        fi

    - name: Package Unix binary
      if: runner.os != 'Windows'
      shell: bash
      run: |
        mkdir -p dist
        tar -czf "dist/sftui-${{ matrix.target }}.tar.gz" \
          -C "target/${{ matrix.target }}/release" sftui \
          -C "$GITHUB_WORKSPACE" LICENSE-MIT

    - name: Package Windows binary
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path dist, staging -Force | Out-Null
        Copy-Item "target/${{ matrix.target }}/release/sftui.exe", LICENSE-MIT -Destination staging
        Compress-Archive -Path staging/* -DestinationPath "dist/sftui-${{ matrix.target }}.zip"

    - uses: actions/upload-artifact@v4
      with:
        name: sftui-${{ matrix.target }}
        path: dist/*
        if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        pattern: sftui-*
        path: dist
        merge-multiple: true
    
    - name: Get version from tag or Cargo.toml
      id: get_version
      run: |
        cargo_version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
        else
          tag_version="${GITHUB_REF#refs/tags/v}"
          if [[ "$cargo_version" != "$tag_version" ]]; then
            echo "Cargo.toml version ($cargo_version) does not match tag version ($tag_version)" >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
        fi
    
    - name: Create Release with binaries
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.get_version.outputs.version) || github.ref_name }}
        target_commitish: ${{ github.sha }}
        name: Release v${{ steps.get_version.outputs.version }}
        body: |
          ## Installation

          Download the archive for your platform from the assets below, or install via cargo:
          ```bash
          cargo install sftui
          ```
        files: dist/*
        fail_on_unmatched_files: true
